server {
  listen 80;
  root /usr/share/nginx/html;

  # Asset ber-hash Vite aman di-cache lama
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Route Vue Router -> index.html; index.html jangan di-cache biar deploy baru langsung kepakai
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
